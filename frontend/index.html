<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/src/assets/images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gacela Conecta</title>
    <script>
      (function () {
        try {
          var u = JSON.parse(localStorage.getItem('user_data') || 'null');
          var id = u && (u.id || u.Id);
          if (id && localStorage.getItem('gacela_theme_' + id) === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Revisa que esta ruta apunte a tu archivo de entrada JS/JSX principal -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
